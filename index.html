<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoForge AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 65px;
    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #292d39;
    background: #08090d;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #9278ff;
}

.menu {
    width: 42px;
    height: 42px;

    border: 1px solid #292d39;
    border-radius: 12px;

    background: #101218;
    color: white;

    font-size: 22px;
    cursor: pointer;
}

main {
    width: min(850px, 92%);
    margin: auto;
    padding: 45px 0 70px;
}

.hero {
    text-align: center;
}

.hero h1 {
    font-size: clamp(40px, 9vw, 65px);
    margin: 0;
}

.hero h1 span {
    color: #9278ff;
}

.hero p {
    color: #9297a5;
    line-height: 1.6;
}


/* ГЕНЕРАТОР */

.generator {
    margin-top: 35px;
    padding: 25px;

    background: #101218;
    border: 1px solid #292d39;
    border-radius: 20px;
}

label {
    display: block;
    margin-bottom: 10px;

    color: #c8cbd4;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 150px;

    padding: 16px;

    resize: vertical;

    background: #08090d;
    color: white;

    border: 1px solid #303442;
    border-radius: 14px;

    outline: none;

    font-size: 15px;
}

textarea:focus {
    border-color: #8068ff;
}

.duration {
    margin-top: 20px;
}

select {
    width: 100%;
    padding: 15px;

    background: #08090d;
    color: white;

    border: 1px solid #303442;
    border-radius: 14px;

    font-size: 15px;
}

.generate {
    width: 100%;
    margin-top: 20px;
    padding: 17px;

    border: 0;
    border-radius: 14px;

    background: linear-gradient(
        135deg,
        #8068ff,
        #5d43d8
    );

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.generate:hover {
    filter: brightness(1.1);
}


/* PREMIUM */

.premium-box {
    margin-top: 20px;
    padding: 18px;

    border: 1px solid #302a4d;
    border-radius: 16px;

    background: #151322;
}

.premium-status {
    color: #c9beff;
    font-weight: bold;
}

.premium-button {
    display: block;

    margin-top: 12px;
    padding: 14px;

    border-radius: 12px;

    background: #29213f;
    color: #c9beff;

    text-align: center;
    text-decoration: none;
    font-weight: bold;
}


/* PREMIUM-ФУНКЦИЯ */

.skip-box {
    display: none;

    margin-top: 20px;
    padding: 18px;

    background: #151322;
    border: 1px solid #8068ff;
    border-radius: 16px;
}

.skip-box.show {
    display: block;
}

.skip-button {
    width: 100%;
    padding: 14px;

    border: 1px solid #8068ff;
    border-radius: 12px;

    background: #201a35;
    color: #c9beff;

    font-weight: bold;
    cursor: pointer;
}


/* ВИДЕО */

.video-box {
    display: none;

    margin-top: 25px;
}

.video-box.show {
    display: block;
}

.video-box video {
    width: 100%;

    background: black;

    border-radius: 16px;
}

.video-placeholder {
    padding: 60px 20px;

    background: #050608;
    border-radius: 16px;

    text-align: center;

    color: #777c89;
}


/* МЕНЮ */

.menu-panel {
    display: none;

    position: fixed;
    top: 75px;
    right: 15px;

    width: 240px;

    padding: 12px;

    background: #11131a;

    border: 1px solid #292d39;
    border-radius: 16px;

    z-index: 100;
}

.menu-panel.show {
    display: block;
}

.menu-panel a {
    display: block;

    padding: 14px;

    color: white;

    text-decoration: none;

    border-radius: 10px;
}

.menu-panel a:hover {
    background: #1d2029;
}


/* ГЕНЕРАЦИЯ */

.loading {
    display: none;

    margin-top: 20px;

    text-align: center;
    color: #9da2af;
}

.loading.show {
    display: block;
}

.spinner {
    width: 35px;
    height: 35px;

    margin: 0 auto 12px;

    border: 4px solid #292d39;
    border-top-color: #9278ff;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>


<body>


<header>

    <div class="logo">
        Video<span>Forge</span> AI
    </div>

    <button
        class="menu"
        onclick="toggleMenu()"
    >
        ☰
    </button>

</header>


<!-- МЕНЮ -->

<div
    id="menuPanel"
    class="menu-panel"
>

    <a href="premium.html">
        👑 Получить Premium
    </a>

    <a href="#">
        ⚙️ Настройки
    </a>

</div>


<main>


    <section class="hero">

        <h1>
            Video<span>Forge</span>
        </h1>

        <p>
            Создай видео из своей идеи
            с помощью искусственного интеллекта.
        </p>

    </section>


    <section class="generator">

        <label>
            🎬 Опиши своё видео
        </label>

        <textarea
            id="prompt"
            placeholder="Например: Огромный дракон летит над городом будущего..."
        ></textarea>


        <div class="duration">

            <label>
                ⏱️ Длительность
            </label>

            <select id="duration">

                <option value="5">
                    5 секунд
                </option>

                <option value="10">
                    10 секунд
                </option>

                <option value="15">
                    15 секунд
                </option>

                <option value="30">
                    30 секунд
                </option>

                <option value="60">
                    60 секунд
                </option>

            </select>

        </div>


        <button
            class="generate"
            onclick="generateVideo()"
        >
            🎬 Сгенерировать видео
        </button>


        <!-- PREMIUM -->

        <div class="premium-box">

            <div
                id="premiumStatus"
                class="premium-status"
            >
                🔒 Premium не активирован
            </div>

            <a
                id="premiumLink"
                class="premium-button"
                href="premium.html"
            >
                👑 Получить Premium
            </a>

        </div>


        <!-- PREMIUM ФУНКЦИЯ -->

        <div
            id="skipBox"
            class="skip-box"
        >

            <button
                class="skip-button"
                onclick="skipLoading()"
            >
                ⚡ Пропустить загрузку (PREMIUM!)
            </button>

        </div>


        <!-- ЗАГРУЗКА -->

        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <div>
                🎬 Видео генерируется...
            </div>

        </div>


        <!-- ВИДЕО -->

        <div
            id="videoBox"
            class="video-box"
        >

            <div class="video-placeholder">
                🎥 Здесь появится готовое видео
            </div>

        </div>

    </section>

</main>


<script>

/* ======================================
   PREMIUM ПРОВЕРКА
====================================== */

function checkPremium() {

    const premium =
        localStorage.getItem(
            "videoforge_premium"
        );


    const status =
        document.getElementById(
            "premiumStatus"
        );

    const link =
        document.getElementById(
            "premiumLink"
        );

    const skip =
        document.getElementById(
            "skipBox"
        );


    if (premium === "true") {

        // Premium активирован

        status.textContent =
            "👑 Premium активирован";

        link.textContent =
            "👑 Premium уже получен";

        link.href = "#";

        skip.classList.add("show");

    } else {

        // Premium не активирован

        status.textContent =
            "🔒 Premium не активирован";

        link.textContent =
            "👑 Получить Premium";

        link.href =
            "premium.html";

        skip.classList.remove("show");

    }

}


/* ======================================
   ПРОВЕРЯЕМ PREMIUM ПРИ ОТКРЫТИИ
====================================== */

window.addEventListener(
    "load",
    checkPremium
);


/*
   Проверяем снова, когда пользователь
   возвращается на эту страницу.
*/

window.addEventListener(
    "pageshow",
    checkPremium
);


/* ======================================
   ГЕНЕРАЦИЯ
====================================== */

function generateVideo() {

    const prompt =
        document.getElementById(
            "prompt"
        ).value.trim();

    const duration =
        document.getElementById(
            "duration"
        ).value;


    if (!prompt) {

        alert(
            "Сначала опиши, какое видео нужно создать!"
        );

        return;
    }


    const loading =
        document.getElementById(
            "loading"
        );

    const videoBox =
        document.getElementById(
            "videoBox"
        );


    videoBox.classList.remove(
        "show"
    );

    loading.classList.add(
        "show"
    );


    /*
       Пока это демонстрация интерфейса.
       Здесь позже подключается API
       настоящей нейросети.
    */

    console.log(
        "Запрос:",
        prompt
    );

    console.log(
        "Длительность:",
        duration,
        "секунд"
    );

}


/* ======================================
   ПРОПУСТИТЬ ЗАГРУЗКУ
====================================== */

function skipLoading() {

    const premium =
        localStorage.getItem(
            "videoforge_premium"
        );


    if (premium !== "true") {

        alert(
            "Эта функция доступна только Premium!"
        );

        return;
    }


    document
        .getElementById("loading")
        .classList
        .remove("show");


    document
        .getElementById("videoBox")
        .classList
        .add("show");

}


/* ======================================
   МЕНЮ
====================================== */

function toggleMenu() {

    document
        .getElementById("menuPanel")
        .classList
        .toggle("show");

}


/* ======================================
   ЗАКРЫТИЕ МЕНЮ
====================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "menuPanel"
            );

        const button =
            document.querySelector(
                ".menu"
            );


        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);

</script>

</body>
</html>
