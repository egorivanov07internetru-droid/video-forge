<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoForge AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
}

/* HEADER */

header {
    height: 65px;
    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #08090d;
    border-bottom: 1px solid #292d39;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #9278ff;
}

.menu {
    width: 42px;
    height: 42px;

    border: 1px solid #292d39;
    border-radius: 12px;

    background: #101218;
    color: white;

    font-size: 22px;
    cursor: pointer;
}

/* MENU */

.menu-panel {
    display: none;

    position: fixed;
    top: 75px;
    right: 15px;

    width: 220px;
    padding: 10px;

    background: #11131a;
    border: 1px solid #292d39;
    border-radius: 16px;

    z-index: 1000;
}

.menu-panel.show {
    display: block;
}

.menu-panel button {
    width: 100%;
    padding: 13px;

    background: transparent;
    color: white;

    border: 0;
    border-radius: 10px;

    text-align: left;
    font-size: 15px;

    cursor: pointer;
}

.menu-panel button:hover {
    background: #1d2029;
}

/* MAIN */

main {
    width: min(850px, 92%);
    margin: auto;
    padding: 45px 0 70px;
}

/* HERO */

.hero {
    text-align: center;
}

.hero h1 {
    margin: 0;

    font-size: clamp(42px, 10vw, 68px);
}

.hero h1 span {
    color: #9278ff;
}

.hero p {
    margin-top: 15px;

    color: #9297a5;
    line-height: 1.6;
}

/* GENERATOR */

.generator {
    margin-top: 35px;
    padding: 25px;

    background: #101218;
    border: 1px solid #292d39;
    border-radius: 20px;
}

label {
    display: block;

    margin-bottom: 10px;

    color: #c8cbd4;
    font-weight: bold;
}

textarea {
    width: 100%;
    min-height: 150px;

    padding: 16px;

    resize: vertical;

    background: #08090d;
    color: white;

    border: 1px solid #303442;
    border-radius: 14px;

    outline: none;

    font-size: 15px;
    font-family: Arial, sans-serif;
}

textarea:focus {
    border-color: #8068ff;
}

/* DURATION */

.duration {
    margin-top: 20px;
}

select {
    width: 100%;

    padding: 15px;

    background: #08090d;
    color: white;

    border: 1px solid #303442;
    border-radius: 14px;

    font-size: 15px;
}

/* GENERATE BUTTON */

.generate {
    width: 100%;

    margin-top: 20px;
    padding: 17px;

    border: 0;
    border-radius: 14px;

    background: linear-gradient(
        135deg,
        #8068ff,
        #5d43d8
    );

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.generate:hover {
    filter: brightness(1.1);
}

.generate:disabled {
    opacity: 0.6;
    cursor: default;
}

/* LOADING */

.loading {
    display: none;

    margin-top: 25px;

    padding: 25px;

    background: #0b0d12;

    border: 1px solid #292d39;
    border-radius: 16px;

    text-align: center;
}

.loading.show {
    display: block;
}

.spinner {
    width: 40px;
    height: 40px;

    margin: 0 auto 15px;

    border: 4px solid #292d39;
    border-top-color: #9278ff;

    border-radius: 50%;

    animation: spin 1s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

/* VIDEO */

.video-box {
    display: none;

    margin-top: 25px;
}

.video-box.show {
    display: block;
}

.video-box video {
    display: block;

    width: 100%;

    background: black;

    border-radius: 16px;
}

.video-placeholder {
    padding: 60px 20px;

    background: #050608;

    border-radius: 16px;

    text-align: center;

    color: #777c89;
}

/* INFO */

.info {
    margin-top: 20px;

    padding: 18px;

    background: #101218;

    border: 1px solid #292d39;
    border-radius: 16px;

    color: #9297a5;

    font-size: 14px;
    line-height: 1.6;
}

/* MOBILE */

@media (max-width: 600px) {

    main {
        padding-top: 35px;
    }

    .generator {
        padding: 20px;
    }

    .hero p {
        font-size: 14px;
    }

}
</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Video<span>Forge</span> AI
    </div>

    <button
        class="menu"
        onclick="toggleMenu()"
        aria-label="Меню"
    >
        ☰
    </button>

</header>


<!-- MENU -->

<div
    id="menuPanel"
    class="menu-panel"
>

    <button onclick="newProject()">
        ✨ Новый проект
    </button>

    <button onclick="clearPrompt()">
        🗑️ Очистить описание
    </button>

</div>


<!-- MAIN -->

<main>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Video<span>Forge</span>
        </h1>

        <p>
            Опиши идею — VideoForge подготовит
            видео по твоему описанию.
        </p>

    </section>


    <!-- GENERATOR -->

    <section class="generator">


        <!-- DESCRIPTION -->

        <label for="prompt">
            🎬 Опиши своё видео
        </label>

        <textarea
            id="prompt"
            placeholder="Например: огромный дракон летит над футуристическим городом на закате..."
        ></textarea>


        <!-- DURATION -->

        <div class="duration">

            <label for="duration">
                ⏱️ Длительность
            </label>

            <select id="duration">

                <option value="5">
                    5 секунд
                </option>

                <option value="10">
                    10 секунд
                </option>

                <option value="15">
                    15 секунд
                </option>

                <option value="30">
                    30 секунд
                </option>

                <option value="60">
                    60 секунд
                </option>

            </select>

        </div>


        <!-- GENERATE -->

        <button
            id="generateButton"
            class="generate"
            onclick="generateVideo()"
        >
            🎬 Сгенерировать видео
        </button>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <div id="loadingText">
                🎬 Подготовка видео...
            </div>

        </div>


        <!-- VIDEO -->

        <div
            id="videoBox"
            class="video-box"
        >

            <div class="video-placeholder">
                🎥 Здесь появится готовое видео
            </div>

        </div>


        <!-- INFO -->

        <div class="info">

            💡 Чем сложнее и масштабнее описание,
            тем больше времени может потребоваться
            на создание видео.

        </div>

    </section>


</main>


<script>

/* ==========================================
   МЕНЮ
========================================== */

function toggleMenu() {

    document
        .getElementById("menuPanel")
        .classList
        .toggle("show");

}


/* ==========================================
   ЗАКРЫТИЕ МЕНЮ
========================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "menuPanel"
            );

        const button =
            document.querySelector(
                ".menu"
            );


        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* ==========================================
   ОЧИСТИТЬ ОПИСАНИЕ
========================================== */

function clearPrompt() {

    document
        .getElementById("prompt")
        .value = "";

}


/* ==========================================
   НОВЫЙ ПРОЕКТ
========================================== */

function newProject() {

    document
        .getElementById("prompt")
        .value = "";

    document
        .getElementById("duration")
        .value = "5";

    document
        .getElementById("loading")
        .classList
        .remove("show");

    document
        .getElementById("videoBox")
        .classList
        .remove("show");

}


/* ==========================================
   ГЕНЕРАЦИЯ
========================================== */

function generateVideo() {

    const prompt =
        document
            .getElementById("prompt")
            .value
            .trim();


    const duration =
        document
            .getElementById("duration")
            .value;


    const button =
        document
            .getElementById("generateButton");


    const loading =
        document
            .getElementById("loading");


    const videoBox =
        document
            .getElementById("videoBox");


    const loadingText =
        document
            .getElementById("loadingText");


    /* Проверка описания */

    if (!prompt) {

        alert(
            "Напиши, какое видео ты хочешь создать!"
        );

        return;
    }


    /* Показываем загрузку */

    videoBox.classList.remove(
        "show"
    );

    loading.classList.add(
        "show"
    );

    button.disabled = true;


    loadingText.textContent =
        "🎬 Подготовка видео...";


    /*
       ВРЕМЕННАЯ ДЕМО-ГЕНЕРАЦИЯ.

       Здесь позже можно подключить
       API настоящей нейросети.
    */

    console.log(
        "VideoForge prompt:",
        prompt
    );

    console.log(
        "Video duration:",
        duration
    );


    /*
       Имитируем процесс генерации,
       чтобы интерфейс уже работал.
    */

    setTimeout(
        function() {

            loadingText.textContent =
                "🎥 Видео почти готово...";

        },
        2500
    );


    setTimeout(
        function() {

            loading.classList.remove(
                "show"
            );

            button.disabled = false;


            videoBox.classList.add(
                "show"
            );


            videoBox.innerHTML = `
                <div class="video-placeholder">
                    🎥 Видео готово
                    <br><br>
                    <small>
                        Настоящая генерация будет
                        подключена через API.
                    </small>
                </div>
            `;

        },
        5000
    );

}

</script>

</body>
</html>
